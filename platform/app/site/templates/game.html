<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Игра</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        #gameContainer {
            width: 100vw;
            height: 100vh;
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 10000;
            font-family: monospace;
            font-size: 16px;
        }
        .back-btn:hover {
            background: rgba(0,0,0,0.9);
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-family: monospace;
        }
        
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script src="/static/functions/game.js"></script>
</head>
<body>
    <button class="back-btn" onclick="window.location.href='/main/'">← На главную</button>
    <div id="gameContainer"></div>
    <div id="loading" class="loading">Загрузка игры...</div>

    <script>
        const sceneId = parseInt('{{ scene_id }}');
        loadAndRunGame(sceneId);
    </script>
</body>
</html>
